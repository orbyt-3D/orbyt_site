<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Live scenes · orbyt</title>
<meta name="description" content="Orbit three live orbyt scenes in your browser: a launch site at night, a server hall and a coastal wind farm at sunset.">
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link rel="canonical" href="https://www.orbyt3d.space/showcase.html">
<meta property="og:type" content="website">

<meta property="og:description" content="Orbit three live orbyt scenes in your browser.">
<meta property="og:url" content="https://www.orbyt3d.space/showcase.html">
<meta property="og:image" content="https://www.orbyt3d.space/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#060b10">
<link rel="stylesheet" href="/css/pages.css">
<style>
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .navigation { flex: none; width: min(1180px, 100% - 40px); }
  .stage { position: relative; flex: 1; margin: 14px; border-radius: 24px; overflow: hidden; background: #0b161c;
    box-shadow: 0 0 0 1px var(--border), 0 40px 140px -50px rgba(45,212,191,.6); }
  #viewer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #viewer:active { cursor: grabbing; }
  #viewer:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }
  .panel { position: absolute; left: 16px; bottom: 16px; max-width: 360px; padding: 16px 18px; border-radius: 18px;
    background: rgba(6,14,18,.72); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border); }
  .panel h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.02em; }
  .panel p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .pills { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 999px;
    background: rgba(6,14,18,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px var(--border); }
  .pills button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; color: var(--muted); white-space: nowrap; transition: background-color .15s, color .15s; }
  .pills button:hover { color: var(--text); }
  .pills button[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); font-weight: 600; }
  .pills button:focus-visible { outline: 2px solid var(--focus); }
  .hud { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 6px; justify-items: end; font: 500 12px/1 var(--mono); color: rgba(232,251,248,.75); pointer-events: none; }
  .hud span { padding: 7px 10px; border-radius: 999px; background: rgba(6,14,18,.6); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; background: #0b161c; color: var(--muted); font: 500 13px var(--mono); transition: opacity .4s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading i { display: block; width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid rgba(45,212,191,.2); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
  @media (max-width: 640px) {
    .stage { margin: 10px; border-radius: 18px; }
    .pills { top: 10px; } .pills button { padding: 7px 10px; font-size: 12.5px; }
    .panel { left: 10px; right: 10px; bottom: 10px; max-width: none; }
    .hud { top: 62px; bottom: auto; right: 10px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<a class="skip-link" href="#viewer">Skip to scene</a>
<header class="navigation">
  <a class="brand" href="/" aria-label="orbyt home"><svg aria-hidden="true"><use href="/img/sprite.svg#logo"/></svg>orbyt</a>
  <span class="version">v0.9.2</span>
  <nav class="nav-links" aria-label="Primary">
    <a class="txt" href="/docs/"><svg class="icon" aria-hidden="true"><use href="/img/sprite.svg#i-book"/></svg><span>Docs</span></a>
    <a class="txt" href="/changelog.html"><svg class="icon" aria-hidden="true"><use href="/img/sprite.svg#i-history"/></svg><span>Changelog</span></a>
    <a class="x-link" href="https://x.com/Orbyt3d" target="_blank" rel="noopener" aria-label="orbyt on X"><svg class="icon" aria-hidden="true"><use href="/img/sprite.svg#i-x"/></svg></a>
    <a class="gh" href="https://github.com/orbyt-3D/orbyt-engine" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="/img/sprite.svg#i-github"/></svg>GitHub</a>
  </nav>
</header>

<main class="stage">
  <canvas id="viewer" tabindex="0" aria-label="Live 3D scene. Drag or use arrow keys to orbit, scroll or plus and minus to zoom."></canvas>
  <div class="pills" role="group" aria-label="Choose a scene">
    <button type="button" data-scene="launch">Launch site</button>
    <button type="button" data-scene="servers">Server hall</button>
    <button type="button" data-scene="wind">Wind farm</button>
  </div>
  <div class="panel" aria-live="polite"><h1 id="scene-title">Launch site</h1><p id="scene-desc"></p></div>
  <div class="hud" aria-hidden="true"><span id="fps">— fps</span><span id="calls">— draw calls</span><span>drag · scroll to zoom</span></div>
  <div class="loading" id="loading"><div><i></i><span id="loading-text">Building scene…</span></div></div>
  <div class="fallback" id="fallback"><p>This scene needs WebGL2. Try a recent version of Chrome, Edge, Firefox or Safari.</p></div>
</main>

<script type="module">
import { buildLaunchSite, buildServerHall, buildWindFarm, makeRenderer, makeComposer, toOrbit, placeCamera, THREE } from '/js/site3d.js';

const SCENES = {
  launch:  { title: 'Launch site', desc: 'A heavy-lift rocket on the pad at night: lattice service tower, floodlights, venting LOX and trucks on the ring road.', build: buildLaunchSite, eye: [130, 48, 150], target: [-6, 42, 0], fov: 38 },
  servers: { title: 'Server hall', desc: 'Three contained cold aisles of racks with live LEDs, cable trays and a chiller yard, roof lifted off.', build: buildServerHall, eye: [46, 58, 72], target: [2, 2, -2], fov: 36 },
  wind:    { title: 'Coastal wind farm', desc: 'Low-poly hills, a sunset sky reflected in the sea and turbines turning on land and offshore.', build: buildWindFarm, eye: [150, 26, 196], target: [-40, 42, -60], fov: 40 },
};

const canvas = document.getElementById('viewer'), stage = canvas.parentElement;
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let renderer;
try { renderer = makeRenderer(canvas); } catch (e) { $('loading').classList.add('done'); $('fallback').style.display = 'grid'; throw e; }
renderer.shadowMap.autoUpdate = false;

const cam = new THREE.PerspectiveCamera(38, 1, .5, 4000);
const { composer, rp, bp } = makeComposer(renderer, new THREE.Scene(), cam, 2, 2);
const MAX_PX = 2.4e6;
let prCap = Math.min(window.devicePixelRatio || 1, 1.5), pr = prCap;

let world = null, key = null, baseDist = 1;
const goal = { yaw: 0, pitch: .3, distance: 100, target: [0, 0, 0], fov: 38 }, cur = { ...goal, target: [0, 0, 0] };
let dragging = false, lastInput = -1e9, start = [0, 0], startAng = [0, 0], clock = 0;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  pr = Math.min(prCap, Math.sqrt(MAX_PX / Math.max(1, w * h)));
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  composer.setPixelRatio(pr); composer.setSize(w, h);
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

function disposeWorld(w) {
  w.scene.traverse(o => { o.geometry?.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m?.dispose?.()); });
  w.scene.environment?.dispose?.();
}

async function show(name) {
  if (!SCENES[name] || name === key) return;
  key = name; const s = SCENES[name];
  document.querySelectorAll('[data-scene]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scene === name)));
  $('scene-title').textContent = s.title; $('scene-desc').textContent = s.desc;
  document.title = `${s.title} · orbyt`;
  history.replaceState(null, '', `?scene=${name}`);
  $('loading').classList.remove('done');
  await new Promise(r => setTimeout(r, 30)); // let the loader paint before the heavy build
  const next = s.build(renderer);
  if (world) disposeWorld(world);
  world = next; rp.scene = world.scene;
  renderer.shadowMap.needsUpdate = true;
  Object.assign(goal, toOrbit(s.eye, s.target), { fov: s.fov });
  Object.assign(cur, goal, { target: [...goal.target] });
  baseDist = goal.distance;
  $('loading').classList.add('done');
}

// input: drag / touch to orbit, wheel and +/- to zoom, arrow keys to orbit
canvas.addEventListener('pointerdown', e => { dragging = true; lastInput = performance.now(); start = [e.clientX, e.clientY]; startAng = [goal.yaw, goal.pitch]; canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return; lastInput = performance.now();
  goal.yaw = startAng[0] - (e.clientX - start[0]) * .0055;
  goal.pitch = Math.max(.03, Math.min(1.4, startAng[1] + (e.clientY - start[1]) * .0045));
});
const end = () => { dragging = false; };
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
const zoom = f => { lastInput = performance.now(); goal.distance = Math.max(baseDist * .3, Math.min(baseDist * 2.2, goal.distance * f)); };
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom(1 + Math.sign(e.deltaY) * .08); }, { passive: false });
canvas.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft') goal.yaw += .12; else if (k === 'ArrowRight') goal.yaw -= .12;
  else if (k === 'ArrowUp') goal.pitch = Math.min(1.4, goal.pitch + .08); else if (k === 'ArrowDown') goal.pitch = Math.max(.03, goal.pitch - .08);
  else if (k === '+' || k === '=') zoom(.9); else if (k === '-') zoom(1.1); else return;
  e.preventDefault(); lastInput = performance.now();
});
document.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', () => show(b.dataset.scene)));

// render loop with an fps / draw-call readout and automatic resolution step-down
let last = performance.now(), frames = 0, acc = 0, fpsT = 0, fpsN = 0;
renderer.info.autoReset = false;
function tick(now) {
  requestAnimationFrame(tick);
  if (document.hidden || !world) { last = now; return; }
  const raw = (now - last) / 1000, dt = Math.min(.05, Math.max(.001, raw)); last = now; clock += dt;
  if (raw < .1) { acc += raw; frames++; if (frames >= 45) { const avg = acc / frames; frames = 0; acc = 0; if (avg > .022 && pr > .7) { prCap = pr = Math.max(.7, pr - .15); resize(); } else if (avg > .022) bp.enabled = false; } }
  if (!dragging && !reduce.matches && now - lastInput > 4000) goal.yaw += dt * .05;
  const k = 1 - Math.exp(-dt * 5);
  cur.yaw += (goal.yaw - cur.yaw) * k; cur.pitch += (goal.pitch - cur.pitch) * k; cur.distance += (goal.distance - cur.distance) * k;
  for (let i = 0; i < 3; i++) cur.target[i] += (goal.target[i] - cur.target[i]) * k;
  cam.fov = goal.fov; cam.updateProjectionMatrix(); placeCamera(cam, cur);
  world.update(reduce.matches ? 3 : clock);
  renderer.info.reset(); composer.render();
  fpsT += raw; fpsN++;
  if (fpsT > .5) { $('fps').textContent = `${Math.round(fpsN / fpsT)} fps`; $('calls').textContent = `${renderer.info.render.calls} draw calls`; fpsT = 0; fpsN = 0; }
}
requestAnimationFrame(tick);

const initial = new URLSearchParams(location.search).get('scene');
show(SCENES[initial] ? initial : 'launch').catch(e => { console.error('[orbyt] scene failed:', e); $('loading-text').textContent = 'This scene failed to load.'; });
</script>
</body>
</html>
